<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="16" y1="46" x2="48" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="1" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Grid lines -->
  <line x1="16" y1="46" x2="48" y2="46" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="16" y1="32" x2="48" y2="32" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="16" y1="18" x2="48" y2="18" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Trend Forecast Path -->
  <path d="M16 44 L26 33 L36 38 L48 20" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Trend Points -->
  <circle cx="16" cy="44" r="3" fill="#38BDF8" />
  <circle cx="26" cy="33" r="3" fill="#38BDF8" />
  <circle cx="36" cy="38" r="3" fill="#38BDF8" />
  <circle cx="48" cy="20" r="4.5" fill="#FFFFFF" filter="url(#glow)" />
</svg>
